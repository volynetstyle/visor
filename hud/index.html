<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>Pure Camera</title>
    <link rel="stylesheet" href="style.css" />
    <script src="contract.js" defer></script>
    <script src="backend.js" defer></script>
    <script src="runtime.js" defer></script>
    <script src="platform.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="viewfinder" aria-label="Видоискатель">
      <div class="top-shade" aria-hidden="true"></div>
      <header class="top-bar">
        <span class="wordmark">PURE CAMERA</span>
        <div id="recording" class="recording" hidden>
          <span></span><time id="timer">00:00</time>
        </div>
        <button id="flash" class="flash" type="button" disabled>ВСПЫШКА АВТО</button>
      </header>

      <div class="frame frame-tl" aria-hidden="true"></div>
      <div class="frame frame-tr" aria-hidden="true"></div>
      <div class="frame frame-bl" aria-hidden="true"></div>
      <div class="frame frame-br" aria-hidden="true"></div>
      <div class="crosshair" aria-hidden="true"></div>
      <div id="focus" class="focus" aria-hidden="true"></div>
      <button id="message" class="message" type="button" disabled>Подключение камеры…</button>

      <div class="bottom-shade" aria-hidden="true"></div>
      <section class="controls" aria-label="Управление камерой">
        <div id="zoom" class="zoom" aria-label="Приближение">1×</div>
        <div class="modes" role="group" aria-label="Режим съёмки">
          <button id="photo" class="mode selected" type="button" aria-pressed="true" disabled>
            ФОТО
          </button>
          <button id="video" class="mode" type="button" aria-pressed="false" disabled>ВИДЕО</button>
        </div>
        <div class="actions">
          <button id="gallery" class="icon-button" type="button" aria-label="Открыть галерею">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="m4 18 5.5-6 3.5 3 2.5-2.5L20 17"></path>
            </svg>
          </button>
          <button id="shutter" class="shutter" type="button" aria-label="Сделать снимок" disabled>
            <span></span>
          </button>
          <button
            id="switch"
            class="icon-button"
            type="button"
            aria-label="Переключить камеру"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 9a7.4 7.4 0 0 0-12.7-2L4 9"></path>
              <path d="M4 4v5h5"></path>
              <path d="M5 15a7.4 7.4 0 0 0 12.7 2L20 15"></path>
              <path d="M20 20v-5h-5"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
