<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <title>NightField</title>
  <script type="module" crossorigin src="./assets/index-B4zAu5F-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CAjCTl3g.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NightField</h1>
        <p>RAW Bayer temporal radiance accumulator</p>
      </div>
      <span id="status">booting</span>
    </header>

    <canvas id="view"></canvas>

    <section class="controls">
      <label>Exposure <output id="exposureOut">250 ms</output>
        <input id="exposure" type="range" min="1" max="1000" value="250" step="1" />
      </label>
      <label>ISO <output id="isoOut">800</output>
        <input id="iso" type="range" min="100" max="3200" value="800" step="50" />
      </label>
      <label>Display gain <output id="gainOut">2.0×</output>
        <input id="gain" type="range" min="0.25" max="12" value="2" step="0.05" />
      </label>
      <label>Observation window
        <select id="duration"><option value="32">32 seconds</option><option value="0">Until stopped</option></select>
      </label>
      <label>View
        <select id="display"><option value="mean">Accumulated signal</option><option value="noise">Temporal noise</option></select>
      </label>
      <p>Static scene · fixed ISO and exposure · focus at infinity. Stop before changing capture settings.</p>
      <div class="buttons">
        <button id="start">Start RAW</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset history</button>
        <button id="export" disabled>Save report</button>
      </div>
    </section>

    <pre id="stats"></pre>
    <pre id="log"></pre>
  </main>
</body>
</html>
