[workspace]
name = "pure-camera"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
openjdk = "21.*"

[tasks]
build = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/build.ps1"
test = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/test.ps1"

[feature.web-check.dependencies]
nodejs = "22.*"

[feature.web-check.tasks]
web-install = { cmd = "npm ci", cwd = "tools" }
contract-generate = "node tools/generate-contract.cjs"
replay = { cmd = "node core/replay/serve.cjs", depends-on = ["web-check"] }
web-check = "node tools/generate-contract.cjs --check && node tools/build-web.cjs && node tools/test-web.cjs"

[environments]
default = { features = [], solve-group = "default" }
web-check = { features = ["web-check"], solve-group = "default" }
